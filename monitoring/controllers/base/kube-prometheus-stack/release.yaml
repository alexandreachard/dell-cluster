apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: kube-prometheus-stack
  namespace: monitoring
spec:
  interval: 30m
  chart:
    spec:
      chart: kube-prometheus-stack
      version: "91.5.0"
      sourceRef:
        kind: HelmRepository
        name: kube-prometheus-stack
        namespace: monitoring
      interval: 12h
  install:
    crds: Create
  upgrade:
    crds: CreateReplace
  driftDetection:
    mode: enabled
    ignore:
      # Ignore "validated" annotation which is not inserted during install
      - paths: ["/metadata/annotations/prometheus-operator-validated"]
        target:
          kind: PrometheusRule
  values:
    grafana:
      admin:
        existingSecret: grafana-admin-pwd
        userKey: grafana-admin-user
        passwordKey: grafana-admin-password
      ingress:
        enabled: true
        ingressClassName: traefik
        hosts:
          - grs.alexandreachard.net
        path: /
        tls:
          - secretName: grafana-tls-secret
            hosts:
              - grs.alexandreachard.net
  # valuesFrom:
  #   - kind: Secret
  #     name: grafana-admin-pwd
  #     valuesKey: grafana-admin-password
  #     targetPath: grafana.adminPassword
