apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: homepage
resources:
  - ../../base/homepage/
  - ingress.yaml
  - homepage-services-secret.yaml
patches:
  - target:
      kind: Deployment
      name: homepage
    patch: |-
      - op: replace
        path: /spec/replicas
        value: 1
      - op: add
        path: /metadata/annotations
        value: 
          environment: staging
      - op: replace
        path: /spec/template/spec/containers/0/env/1/value
        value: "$(MY_POD_IP):3000,${HOMEPAGE_HOST}"
