apiVersion: apps/v1
kind: Deployment
metadata:
  name: homepage
spec:
  replicas: 1
  selector:
    matchLabels:
      app: homepage
  template:
    metadata:
      labels:
        app: homepage
    spec:
      serviceAccountName: homepage
      securityContext:
        runAsUser: 1000
        runAsGroup: 1000

      containers:
        - name: homepage
          image: ghcr.io/gethomepage/homepage:v2.7.0
          ports:
            - containerPort: 3000

          securityContext:
            allowPrivilegeEscalation: false

          env:
            - name: MY_POD_IP
              valueFrom:
                fieldRef:
                  fieldPath: status.podIP
            - name: HOMEPAGE_ALLOWED_HOSTS
              value: "$(MY_POD_IP):3000"

          livenessProbe:
            httpGet:
              path: /api/healthcheck
              port: 3000
            initialDelaySeconds: 10
            periodSeconds: 15

          volumeMounts:
            - name: homepage-merged-config
              mountPath: /app/config
            - name: logs
              mountPath: /app/config/logs
      volumes:
        - name: homepage-merged-config
          projected:
            sources:
              - configMap:
                  name: homepage-configmap
              - secret:
                  name: homepage-services-secret
        - name: logs
          emptyDir: {}
