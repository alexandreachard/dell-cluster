apiVersion: apps/v1
kind: Deployment
metadata:
  name: homepage
spec:
  replicas: 1
  selector:
    matchLabels:
      app: homepage
  template:
    metadata:
      labels:
        app: homepage
    spec:
      securityContext:
        runAsUser: 1000
        runAsGroup: 1000

      containers:
        - name: homepage
          image: ghcr.io/gethomepage/homepage:v99.99.99-crash-test
          ports:
            - containerPort: 3000

          securityContext:
            allowPrivilegeEscalation: false

          volumeMounts:
            - name: homepage-config
              mountPath: /app/config

      volumes:
        - name: homepage-config
          configMap:
            name: homepage-configmap
